name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 第一次部署前，請先到 Settings → Pages → Build and deployment
      # 將 Source 設為 "GitHub Actions"，否則 configure-pages 會失敗。
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # setup-vp 會依 package.json / lockfile 安裝 Vite+、Node.js、pnpm 與專案依賴。
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Build
        run: vp run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # 預設會排除 dotfiles，需開啟才能帶上 public/.nojekyll
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
